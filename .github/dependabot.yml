# Dependabot — monatliche Update-PRs.
#
# In diesem Repo lief bisher gar kein Dependabot: die Datei fehlte. Ein
# fehlender Scheduler meldet sich nicht, deshalb ist das nie aufgefallen.
#
# Bewusst OHNE `labels:`. Die im Portfolio übliche Zeile `labels: ["dependencies"]`
# verlangt ein Label, das am 2026-08-28 in 23 von 24 geprüften Repos nicht
# existierte; Dependabot quittiert das mit einem Kommentar an jedem PR. Sieben
# Server fahren die Konfiguration deshalb schon ohne. Existiert das Label, kann
# die Zeile nachgezogen werden.
version: 2
updates:

  # Python-Abhängigkeiten aus pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        # pypdf steht in pyproject.toml auf eine Minor-Obergrenze, weil schon
        # ein Minor (6.20.0) die Spaltentrennung der UVG-Tabellen brach. Ein
        # solcher Bump soll seinen eigenen PR bekommen: Wird er rot, haelt er
        # nur sich selbst auf und nicht jedes andere Python-Update mit.
        # Abhaengigkeiten ausserhalb jeder Gruppe kommen laut Dependabot-
        # Referenz einzeln: «Any outdated dependencies that do not match a
        # rule are updated in individual pull requests.»
        exclude-patterns: ["pypdf"]

  # Gepinnte Action-Versionen in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
