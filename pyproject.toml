[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "seco-labor-mcp"
version     = "0.4.0"
description = "MCP server for Swiss labor market data (SECO/AMSTAT) – Arbeitsmarkt & Stellensuche"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.11"
authors     = [{ name = "malkreide" }]
keywords = [
    "mcp", "model-context-protocol", "swiss-open-data",
    "seco", "labor-market", "arbeitsmarkt",
    "unemployment", "arbeitslosigkeit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Obergrenzen als Schutz vor Major-Bumps, die ohne Codeaenderung einschlagen.
    #
    # fastmcp: auf PyPI liegt bereits eine 4.0-Beta (4.0.0b1). Solange `>=1.0.0`
    # nach oben offen steht, zieht der erste stabile 4.0-Release ungefragt ein
    # neues Major. Dieses Repo nutzt Variant B (`from fastmcp import FastMCP`)
    # und ist auf der 3.x-Linie verifiziert (getestet mit 3.4.5).
    #
    # Wichtig fuer die laufende Fleet-Migration auf MCP-Spec 2026-07-28: fastmcp
    # 3.x zieht `mcp<2.0` (aufgeloest: mcp 1.29.0), waehrend mcp 2.0.0 stabil
    # verfuegbar ist. Der Sprung auf mcp 2.x erfolgt deshalb bewusst ueber ein
    # fastmcp-Upgrade, nicht als Nebenwirkung eines offenen Ranges.
    "fastmcp>=1.0.0,<4",
    # httpx ist pre-1.0; auf PyPI stehen bereits 1.0.dev-Releases. Das Major
    # bricht erfahrungsgemaess Transport- und Mock-Verhalten (respx).
    "httpx>=0.27.0,<1",
    # Pydantic v2 ist die Portfolio-Konvention. v3 waere ein Modellbruch.
    "pydantic>=2.0.0,<3",
    # pypdf fuer die UVG-Tabellen. Die Quelle publiziert ausschliesslich PDF
    # (siehe PROBE_REPORT_UVG.md), es gibt kein CSV/JSON. Der Parser haengt am
    # layout-Extraktionsmodus, dessen Whitespace-Verhalten die Spaltentrennung
    # traegt -- ein Major-Bump darf hier nicht ungefragt einziehen.
    "pypdf>=5.0.0,<7",
    # openpyxl fuer die BFS-Jahrestabelle. Die Reihe der registrierten
    # Arbeitslosen und Stellensuchenden gibt es nur als XLSX -- weder CSV noch
    # SDMX, geprueft am 2026-08-14. Der Parser haengt an der Zellenlesung von
    # `read_only`-Arbeitsmappen; ein Major-Bump darf hier nicht ungefragt
    # einziehen.
    "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    # Exakter Pin, kein Range: ruff ist pre-1.0, seine Minors sind die Stelle,
    # an der Regelverhalten und neue Checks innerhalb der gewaehlten Familien
    # landen. Ein Range wird ohne Codeaenderung rot.
    #
    # Vorher stand hier `>=0.5.0,<0.17`. Der Cap allein genuegt nicht: die CI
    # faehrt `ruff==0.16.4`, ein `pip install -e ".[dev]"` erfuellt die Spanne
    # aber mit einer beliebigen Version darin. Lokal gruen und in der CI rot
    # war damit moeglich, ohne dass jemand etwas verursacht hat.
    #
    # Diese Zeile ist die einzige Quelle: Anheben genuegt hier, `ci.yml`
    # installiert keine zweite Version mehr. Der Schritt `pip install
    # ruff==...`, auf den dieser Absatz frueher verwies, ist entfernt — er
    # lief nach dem dev-Install und gewann gegen diese Zeile, sodass ein Bump
    # hier die CI nicht erreichte. `tests/test_werkzeug_versionen.py` faellt,
    # wenn wieder ein Workflow eine Version setzt.
    #
    # Vor dem Lauf `ruff --version` pruefen: ein aelteres ruff frueher im
    # `PATH` schlaegt den Pin, ohne dass der Install etwas meldet.
    # `scripts/check_ruff_pin.py` prueft genau das.
    "ruff==0.16.4",
]

[project.scripts]
seco-labor-mcp = "seco_labor_mcp.server:main"

[project.urls]
Homepage   = "https://github.com/malkreide/seco-labor-mcp"
Repository = "https://github.com/malkreide/seco-labor-mcp"
Issues     = "https://github.com/malkreide/seco-labor-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/seco_labor_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"
markers      = [
    "live: live API tests (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
